<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    {% if page.title %}
      {{ page.title }} – {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Favicon / ícone da marca (V em gradiente) -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/icon-v.svg' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16.png' | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />

  <!-- Fonte URW Gothic auto-hospedada: preload para evitar FOUT -->
  <link rel="preload" href="{{ '/assets/fonts/URWGothic-Book.otf' | relative_url }}" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="{{ '/assets/fonts/URWGothic-Demi.otf' | relative_url }}" as="font" type="font/otf" crossorigin />

  <!-- Folha de estilo principal (identidade Vintalie) -->
  <link rel="stylesheet" href="{{ 'assets/style.css' | relative_url }}" />
  <!-- Font Awesome (ícones) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
