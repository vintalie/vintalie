<section id="lead-form" class="form-section">
  <h2>Vamos transformar <span style="color:#A98BFF;">sua marca</span>?</h2>
  <p>Preencha o formulário e nosso time entrará em contato para criar uma solução sob medida.</p>
  <form class="form-group" action="https://formspree.io/f/seu-id" method="POST">
    <input type="text" name="nome" placeholder="Seu nome completo" required />
    <input type="email" name="email" placeholder="Seu melhor e-mail" required />
    <input type="text" name="empresa" placeholder="Nome da sua empresa" />
    <textarea name="mensagem" placeholder="Conte-nos sobre seu desafio ou objetivo..." rows="4"></textarea>
    <button type="submit" class="btn-submit">
      <i class="fas fa-paper-plane" style="margin-right:10px;"></i>Quero evoluir minha marca
    </button>
  </form>
  <p style="font-size:0.85rem; color:rgba(255,255,255,0.4); margin-top:1rem;">
    Ao enviar, você concorda com nossa política de privacidade.
  </p>
</section>
