<script>
  // Scroll suave para links internos
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      if (href !== '#') {
        e.preventDefault();
        const target = document.querySelector(href);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      }
    });
  });

  // ---- Menu mobile: abre/fecha o painel de navegação ----
  (function () {
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.getElementById('mobile-menu');
    if (!toggle || !menu) return;

    toggle.addEventListener('click', function () {
      const isOpen = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Abrir menu' : 'Fechar menu');
      menu.classList.toggle('open', !isOpen);
    });

    // Fecha o menu ao clicar em um link do painel (boa prática mobile)
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function () {
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
        menu.classList.remove('open');
      });
    });
  })();

  // ---- Barra de pesquisa de postagens (índice /search.json) ----
  (function () {
    const panel = document.getElementById('search-panel');
    if (!panel) return;

    const input = document.getElementById('search-input');
    const sectionSel = document.getElementById('search-section');
    const categorySel = document.getElementById('search-category');
    const clearBtn = document.getElementById('search-clear');
    const results = document.getElementById('search-results');

    let index = [];
    let loaded = false;

    // Carrega o índice JSON (posts do blog + artigos de serviços)
    function loadIndex() {
      if (loaded) return Promise.resolve(index);
      return fetch('{{ "/search.json" | relative_url }}')
        .then(r => r.json())
        .then(data => { index = data; loaded = true; populateCategories(); return index; })
        .catch(() => { results.innerHTML = '<p class="search-hint">Não foi possível carregar a busca.</p>'; return []; });
    }

    // Preenche o select de categorias a partir do índice
    function populateCategories() {
      const cats = new Set();
      index.forEach(it => (it.categories || []).forEach(c => cats.add(c)));
      const sorted = Array.from(cats).sort();
      sorted.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
        categorySel.appendChild(opt);
      });
    }

    // Normaliza texto (remove acentos, minúsculas)
    function norm(s) {
      return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    // Filtra e renderiza os resultados
    function render() {
      const q = norm(input.value.trim());
      const section = sectionSel.value;
      const category = categorySel.value;

      let items = index;
      if (section) items = items.filter(it => it.section === section);
      if (category) items = items.filter(it => (it.categories || []).includes(category));
      if (q) {
        items = items.filter(it =>
          norm(it.title).includes(q) ||
          norm(it.excerpt).includes(q) ||
          (it.categories || []).some(c => norm(c).includes(q))
        );
      }

      const anyFilter = q || section || category;
      if (!anyFilter) {
        results.innerHTML = '<p class="search-hint">Digite para buscar entre posts do blog e artigos de serviços.</p>';
        return;
      }

      if (!items.length) {
        results.innerHTML = '<p class="search-hint">Nenhum resultado encontrado.</p>';
        return;
      }

      results.innerHTML = '<p class="search-count">' + items.length + ' resultado(s)</p>' +
        items.map(it => `
          <a class="search-result" href="${it.url}">
            <span class="search-result-section">${it.section_label}</span>
            <span class="search-result-title">${it.title}</span>
            <span class="search-result-date">${it.date_label}</span>
          </a>`).join('');
    }

    // Eventos
    input.addEventListener('input', render);
    sectionSel.addEventListener('change', render);
    categorySel.addEventListener('change', render);
    clearBtn.addEventListener('click', () => {
      input.value = '';
      sectionSel.value = '';
      categorySel.value = '';
      render();
    });

    // Carrega o índice assim que a página estiver pronta
    loadIndex();
  })();
</script>
