title: Vintalie – Soluções Digitais
description: Ideias que movem marcas.
author: Vintalie
baseurl: ""
url: "https://vintalie.com.br"

# Google Tag Manager / Google Analytics 4 (ID do contêiner). Deixe vazio para desativar.
gtm_id: "G-J367W8C80H"

# ============================================================================
# Coleções
#   • testimonials : depoimentos de clientes
#   • servicos     : artigos de serviço (mesma lógica do blog: categorias + paginação)
# ============================================================================
collections:
  testimonials:
    output: true
    permalink: /depoimentos/:path/
  servicos:
    output: true
    permalink: /servicos/:title/

# Posts do blog (com paginação)
permalink: /blog/:year/:month/:day/:title/

defaults:
  # Posts do blog
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      section: "blog"
  # Artigos de serviço
  - scope:
      path: ""
      type: "servicos"
    values:
      layout: "servico"
      section: "servicos"
  # Depoimentos
  - scope:
      path: ""
      type: "testimonials"
    values:
      layout: "testimonial"
  # Demais páginas
  - scope:
      path: ""
    values:
      layout: "default"

# Configurações de paginação (blog)
pagination:
  enabled: true
  per_page: 5
  permalink: '/page/:num/'
  title_suffix: ' - página :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap

# Arquivos/pastas que NÃO vão para o build (artefatos internos, docs de apoio)
exclude:
  - briefing-orquestracao.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - Containerfile